<!-- templates/documents/participant_list.html -->
{% extends "base.html" %}

{% block title %}Список участников{% endblock %}

{% block content %}
<h2>Список участников</h2>

<table class="table table-striped table-hover">
    <thead>
        <tr>
            <th>ФИО</th>
            <th>Роль</th>
        </tr>
    </thead>
    <tbody>
        {% for participant in participant_list %}
        <tr>
            <td>{{ participant.full_name }}</td>
            <td>
                <span style="background-color: {{ participant.get_background_color }}; padding: 4px 8px; border-radius: 4px;">
                    {{ participant.get_role_display }}
                </span>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="2">Участников нет</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
