<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Criminal Procedure Helper{% endblock %}</title>
    <!-- Подключаем Bootstrap для таблиц и типографики (если ещё не подключён) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Заголовок приложения на голубом фоне -->
    <header style="background-color: #ADD8E6; padding: 1rem; text-align: center;">
        <h1>Criminal Procedure Helper</h1>
    </header>

    <main class="container mt-3">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
