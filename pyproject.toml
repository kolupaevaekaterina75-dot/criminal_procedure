[tool.poetry]
name = "criminal-procedure"
version = "0.1.0"
description = "Веб-приложение, помогающее составлять процессуальные документы"
authors = ["Балашова Екатерина Николаевна <kolupaevaekaterina75@gmail.com>"]
readme = "README.md"
#requires-python = ">=3.10,<3.13"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
django = "^5.0"
django-debug-toolbar = "^4.0"
docxtpl = "^0.16"
python-dotenv = "^1.0.0"
pytest = "^8.0"
pytest-django = "^4.9"
flake8 = "^7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-django = "^4.9"
flake8 = "^7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"