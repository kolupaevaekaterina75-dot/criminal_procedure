[tool.poetry]
name = "criminal-procedure"
version = "0.1.0"
description = "Веб-приложение, помогающее составлять процессуальные документы"
authors = ["Балашова Екатерина Николаевна <kolupaevaekaterina75@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
django = "^5.0"
django-debug-toolbar = "^4.0"
docxtpl = "^0.16"
python-dotenv = "^1.0.0"
pytest = "^8.0"
pytest-django = "^4.9"
flake8 = "^7.0"
freezegun = "^1.5.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"